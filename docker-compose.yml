services:
  postgres:
    image: postgres:16-alpine
    container_name: trip_planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trip_planner
      POSTGRES_PASSWORD: trip_planner_dev_password
      POSTGRES_DB: trip_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
